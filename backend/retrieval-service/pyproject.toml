[project]
name = "retrieval-service"
version = "0.1.0"
description = "GuguWiki internal retrieval and ingestion service"
readme = "README.md"
authors = [
    { name = "Tr1kz7", email = "wmo46543@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
retrieval-service = "retrieval_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
